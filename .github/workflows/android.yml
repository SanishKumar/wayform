name: Android native core
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install Android command-line tools
        run: |
          curl -fSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  '"$RUNNER_TEMP/android-tools.zip" > "$RUNNER_TEMP/android-tools.sha256"
          sha256sum --check "$RUNNER_TEMP/android-tools.sha256"
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-sdk/cmdline-tools"
          mv "$RUNNER_TEMP/android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          { yes || true; } | "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Install pinned NDK
        run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build Kotlin bindings and Android libraries
        run: bash scripts/build-android-core.sh
      - name: Check and assemble Android app
        working-directory: apps/android
        run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assemblePreview :app:lintDebug :app:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/
            apps/android/app/build/outputs/apk/androidTest/
            apps/android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: android-preview
          path: apps/android/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: android-native-core
          path: target/android-mobile/
          if-no-files-found: error
          retention-days: 7
